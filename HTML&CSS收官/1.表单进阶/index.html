<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <form action="" class="container">
    <h2>用户注册</h2>
    <div class="form-item">
      <input class="txt" type="text" placeholder="请输入手机号" maxlength="11">
    </div>
    <div class="form-item clearfix">
      <input class="txt left code" type="text" placeholder="请填写验证码">
      <button type="button" class="right">发送验证码</button>
    </div>
    <div class="form-item">
      <input class="txt" type="text" placeholder="请输入密码">
    </div>
    <div class="form-item">
      <input class="txt" type="text" placeholder="请输入密码">
    </div>
    <div class="form-item">
      <select multiple class="txt select">
        <option>爱好1</option>
        <option>爱好2</option>
        <option>爱好3</option>
        <option>爱好4</option>
        <option>爱好5</option>
        <option>爱好6</option>
        <option>爱好7</option>
        <option>爱好8</option>
        <option>爱好9</option>
        <option>爱好10</option>
      </select>
    </div>
    <div class="form-item clearfix">
      <div class="left title">性别</div>
      <div class="left">
        <label>
          <input type="radio" name="sex" checked>
          <span>男</span>
        </label>
      </div>
      <div class="left">
        <label>
          <input type="radio" name="sex" checked>
          <span>女</span>
        </label>
      </div>
    </div>
    <div class="form-item">
      <textarea class="txt textarea" placeholder="请输入个人简介"></textarea>
    </div>
    <div class="form-item policy">
      <label>
        <input type="checkbox">
        <span>同意用户协议</span>
      </label>
    </div>
    <div class="form-item">
      <button>立即注册</button>
      <button type="button">重置表单</button>
    </div>
  </form>
</body>
</html>
