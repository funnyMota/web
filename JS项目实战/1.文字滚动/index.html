<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      background: #bfedfc;
      overflow: hidden;
      padding: 20px 0;
    }
    /* .container::after {
      content: '';
      display: block;
      clear: both;
    } */
    .title {
      float: left;
      font-size: 16px;
      font-weight: normal;
      margin: 0;
      margin-left: 20px;
      margin-top: 5px;
      border-right: 2px solid #ccc;
      padding-right: 30px;
    }
    .list {
      float: left;
      list-style: none;
      padding: 0;
      height: 30px;
      overflow: hidden ;
      margin: 0;
      margin-left: 50px;
      
    }
    .list li {
      height: 30px;
      line-height: 30px;
    }
  </style>

</head>
<body>
  <div class="container">
    <h1 class="title">最新公告</h1>
    <ul class="list">
      <!-- 乱数假文 -->
      <li>把大象装冰箱总共分几步？</li>
      <li>1. 邓哥打开冰箱门</li>
      <li>2. 邓哥把大象放进去</li>
      <li>3. 邓哥关上冰箱门</li>
    </ul>
  </div>
  <script src="./index.js"></script>
</body>
</html>
