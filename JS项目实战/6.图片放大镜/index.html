<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .clearfix::after{
      content: '';
      display: block;
      clear: both';
    }
    .left{
      float: left;
      position: relative;
    }
    .right{
      float: right;
    }
    .container{
      width: 100%;
      height: 800px;
      margin: 50px;
    }
    .left-img{
      display: inline-block;
      width: 430px;
      height: 430px;
      outline: 1px solid #ccc;
      position: relative;
      cursor: pointer;
    }
    .mask{
      width: 230px;
      height: 230px;
      background:url(./images/bg.png);
      position: absolute;
      left: 0;
      top: 0;
      display: none;
    }
    .right-img{
      display: inline-block;
      width: 430px;
      height: 430px;
      outline: 1px solid #ccc;
      margin-left: 10px;
      display: none;
    }
    .wrapper{
      width: 430px;
      text-align: center;
      margin-top: 10px;
    }
    .img-list{
      display: inline-block;
    }
    .img-list .active{
      border: 1px solid black;
    }
    ul li{
      list-style: none;
      float: left;
      margin:10px;
      border: 1px solid #ccc;
      padding: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container clearfix">
    <div class="left">
      <div class="left-img">
        <div class="mask"></div>
      </div>
      <div class="wrapper">
        <ul class="img-list">
          <!-- <li><img src="./images/imgA_1.jpg" alt=""></li>
          <li><img src="./images/imgB_1.jpg" alt=""></li>
          <li><img src="./images/imgC_1.jpg" alt=""></li> -->
        </ul>
      </div>
    </div>
    <div class="left">
      <div class="right-img"></div>
    </div>
  </div>
  <script src="./index.js"></script>
</body>
</html>
