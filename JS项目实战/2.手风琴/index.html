<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    h2 {
      margin: 0;
      padding: 0;
      font-size: 100%;
      font-weight: normal;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-container {
      width: 200px;
      margin: 0 auto;
      line-height: 30px;
    }

    .menu-container h2 {
      padding: 0 25px;
      cursor: pointer;
      background: lightblue;
    }

    .submenu {
      background: #e0f0f7;
      padding: 0 30px;
      height: 0;
      overflow: hidden;
    }
    .menu {
      margin: 20px 0;
    }

    .submenu li {
      height: 30px;
      color: black;
    }

  </style>
</head>
<body>
  <ul class="menu">
    <li class="menu-container">
      <h2>菜单1</h2>
      <ul class="submenu">
        <li>列表1</li>
        <li>列表2</li>
        <li>列表3</li>
        <li>列表4</li>
      </ul>
    </li>
    <li class="menu-container ">

    </li>
  </ul>
