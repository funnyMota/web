<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
  rel="stylesheet"
  href="https://at.alicdn.com/t/font_2514356_wk4v3jli7km.css"
/>
  <style>
    *{
      padding: 0;
      margin: 0;
      scroll-behavior: smooth;
    }
    a{
      text-decoration: none;
      color: white;
    }
    ul{
      position: fixed;
      right: 0;
      top: 50%;
      width: 100px;
      height: 150px;
      background:rgba(0, 0, 0, 0.5);
      border-radius: 5px 0px 0px 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      box-shadow: 0px 0px 5px white;
      transition: 0.5s;
      z-index: 1;
      transform: translate(80%, -50%);
    }
    ul:hover{
      transform: translate(0, -50%);
    }
    ul li{
      list-style: none;
      line-height: 30px;
    }
    #page1{
      width: 100vw;
      height: 100vh;
      background-color: #4e7bcf;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #page1 img{
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      transition: 0.3s;
    }
    #page1 img:hover{
      transform: scale(1.3);
    }
    #page1 span{
      color: white;
      margin-bottom: 2%;
    }
    #page1 .iconfont{
      text-align: center;
      margin-bottom: 2%;
      display: block;
      font-size: 40px;
      color: orange;
    }
    #page2{
      width: 100vw;
      height: 100vh;
      background-color: orange;
    }
    #page2{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .arrow{
      width: 200px;
      height: 5px;
      background-color: #333;
      margin: 20px 0;
      position: relative;
    }
    .arrow::before{
      content: '';
      position: absolute;
      border: 10px solid;
      border-color: transparent transparent transparent #333;
      right: -20px;
      top: -8px;
    }
    .bubble{
      width: 150px;
      height: 50px;
      background-color: white;
      text-align: center;
      line-height: 50px;
      border-radius: 5px;
      position: relative;
    }
    .bubble::after{
      content: '';
      border: 10px solid;
      border-color: white transparent transparent transparent;
      position: absolute;
      border-left-width: 5px;
      left: 50%;
      top: -5px;
      transform: rotate(-30deg);
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#page1">第一页</a></li>
    <li><a href="#page2">第二页</a></li>
  </ul>
  <div id="page1">
    <span>
      <i class="iconfont iconCatFootprint"></i>
      小猫咪
    </span>
    <img src="./cat.jpg" alt="">
  </div>
  <div id="page2">
      <div class="arrow"></div>
      <div class="bubble">这是一个箭头</div>
  </div>
</body>
</html>
