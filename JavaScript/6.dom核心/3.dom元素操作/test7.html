<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      width: 100px;
      height: 100px;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <div>
    
  </div>
  <script>
    var div=document.querySelector("div");
    div.onclick=function(){
      div.style.backgroundColor=`rgb(${getNumber()},${getNumber()},${getNumber()})`
    }
    function getNumber(){
      return Math.floor(Math.random()*255);
    }
  </script>
</body>
</html>
