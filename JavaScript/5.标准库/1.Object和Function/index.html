    function sayHello(){
      console.log(this.name,this.age);
    }
    var user1={
      name:"张三",
      age:20,
    }
    var user2={
      name:"李四",
      age:30,
    }

    sayHello.apply(user1);
    sayHello.call(user2);

    function test(){
      console.log(arguments);
      return [].slice.apply(arguments);
    }
    var arr=test(23,4,5,7,8,8,7);

    function greet(greeting, punctuation) {
      console.log(greeting + ', ' + this.name + punctuation);
    }

    var person = { name: '张三' };

    greet.call(person, '你好', '！');
    greet.apply(person, ['你好', '！']);
    var boundGreet = greet.bind(person, '你好');
    boundGreet('！');
