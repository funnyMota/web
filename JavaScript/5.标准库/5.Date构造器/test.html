    //3
   function print(){
     var now = new Date();
     var year=now.getFullYear();
     var month=now.getMonth()+1;
     var days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
     for(var i=1;i<=days;i++){
      console.log(getDayOfWeek(year,month,i));
     }
   }
   function getDayOfWeek(year,month,day){
      var date = new Date(year,month-1,day);
      var dayOfWeek = date.getDay();
      if(dayOfWeek === 0){
        dayOfWeek = "周日";
      }else if(dayOfWeek === 1){
        dayOfWeek = "周一";
      }else if(dayOfWeek === 2){
        dayOfWeek = "周二";
      }else if(dayOfWeek === 3){
        dayOfWeek = "周三";
      }else if(dayOfWeek === 4){
        dayOfWeek = "周四";
      }else if(dayOfWeek === 5){
        dayOfWeek = "周五";
      }else if(dayOfWeek === 6){
        dayOfWeek = "周六";
      }
      return `${year}年${month}月${day}日 ${dayOfWeek}`;
   }
    print();
  </script>
