    function bigCamel(s){
      return s.split(' ').filter((item)=>{
        return item.length>0;
      }).map((item)=>{
        return item[0].toUpperCase()+item.substring(1).toLowerCase();
      }).join('');
    }

    //书写一个函数,产生一个指定长度随机字符串,字符串由大小写字母和数字组成
    function getRandomString(length){
      var str='';
      var template='';
      for(var i=65;i<65+26;i++){
        template+=String.fromCharCode(i);
      }
      for(var i=97;i<97+26;i++){
        template+=String.fromCharCode(i);
      }
      for(var i=48;i<48+10;i++){
        template+=String.fromCharCode(i);
      }
      for(var i=0;i<length;i++){
        var randomNum=Math.floor(Math.random()*template.length);
        str+=template[randomNum];
      }
      return str;
    }
    console.log(getRandomString(10));

    function getInfoFromIdCard(str){
      return {
        birthYear:str.substr(6,4),
        birthMonth:str.substr(10,2),
        birthDay:str.substr(12,2),
        sex:str[str.length-2]%2==0?'女':'男'
