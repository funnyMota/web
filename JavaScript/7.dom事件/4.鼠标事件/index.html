<html lang="en">

  <style>
    div{
      width: 100px;
      height: 100px;
      background-color: red;
      border-radius: 50%;
      cursor: move;
      position: absolute;
      left: 100px;
      top:100px;
    }

</head>
<body>
  <div></div>
  <script>

    // div.onmousedown=function(e){

    //       div.onmousemove=null;
    //       console.log("鼠标抬起");
    //     }
    //   }
    // }

    var div=document.querySelector("div");
    var style=getComputedStyle(div);
    div.onmousedown=function(e){
      var pageX=e.pageX;
      var pageY=e.pageY;
      var divLeft=parseFloat(style.left);
      var divTop=parseFloat(style.top);
      window.onmousemove=function(e){
        var disX=e.pageX-pageX;
        var disY=e.pageY-pageY;
        div.style.left=divLeft+disX+"px";
        div.style.top=divTop+disY+"px";
        console.log("鼠标移动");
      }
      window.onmouseup=window.onmouseleave=function(e){
        if(e.button===0){
          window.onmousemove=null;
        }
      }
    }
  </script>
</body>
</html>
