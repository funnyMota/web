    /**
     * sumOfArray:对数组求和
     * @param {Array} arr 需要求和的数组
     * @return {Number} 数组元素的和 
     * 
    */
   
    function sumOfArray(arr){
      var sum=0;
      for(var i=0;i<arr.length;i++){
        sum+=arr[i];
      }
      return sum;
    }
    console.log(sumOfArray([1,2,3,4,5])+sumOfArray([6,7,8,9,10]));
