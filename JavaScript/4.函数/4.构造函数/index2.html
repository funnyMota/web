<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function Person(name,damage,defence,hp,critRate){
      this.name=name;
      this.damage=damage;
      this.defence=defence;
      this.hp=hp;
      this.critRate=critRate;
      this.printInfo=function(){
        console.log(this.name+': damage='+this.damage+', defence='+this.defence+', hp='+this.hp+', critRate='+this.critRate);
      }
      this.hit=function(ctor){
        var damage = this.damage - ctor.defence;
        var rate =this.critRate/100;
        var rad=Math.random();
        if(rad<rate){
          damage*=2;
        }
        if(damage<1){
          damage=1;
        }
        console.log(this.name+'伤害+'+damage);
        this.hp-=damage;
      }
    }
    var hero=new Person('英雄', 10, 0, 50, 40);
    var monster=new Person('怪物', 10, 0, 50,40);
    hero.printInfo();
    monster.printInfo();
    while(1){
      hero.hit(monster);
      monster.hit(hero);
      if(hero.hp<=0||monster.hp<=0){
        console.log(monster.hp>hero.hp?'怪物胜利':'英雄胜利');
        break;
      }
    }
  </script>
</body>
</html>
