<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function User(name,age,gender){
      if(new.target===User){
        this.name=name;
        this.age=age;
        this.gender=gender;
        this.sayHello=function(){
          console.log('Hello, my name is '+this.name);
        }
      }else{
        return {
          name,
          age,
          gender,
          sayHello:function(){
            console.log('Hello, my name is '+this.name);
          }
        }
      }
  
      //  return [1,2,3];
    }

    var a=new User('zhangsan', 20, 'male');
    console.log(a); // [1, 2, 3]
    a.sayHello(); // Hello, my name is zhangsan
  </script>
</body>
</html>
