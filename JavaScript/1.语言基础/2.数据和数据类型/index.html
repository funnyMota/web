<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    console.log(1);
    console.log("测试");
    console.log(true);
    console.log(undefined);
    console.log(null);
    console.log(typeof(true));
    console.log("\t我是制表符");
    console.log("\"我是双引号\"");
    console.log("\'我是单引号\'");
    console.log("`我是模版字符`");
    console.log(Object);
    console.log({name:"张三",age:18,city:{
      name:"北京",
      province:"北京"
    }})

    console.log(typeof Number(1));
    console.log(typeof String("1"));
    console.log(typeof Boolean(1));
    console.log(typeof undefined);
    console.log(typeof null);
    console.log(typeof NaN);

    console.log({
      name:"张三",
      age:23,
      city:{
        province:"四川",
        city:"成都"
      }
    })
  </script>
</body>
</html>
