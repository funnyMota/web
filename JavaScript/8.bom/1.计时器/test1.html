<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>

  </h1>
  <script>
    var h1=document.querySelector("h1");
    setInterval(setTime,1000);
    function setTime(){
      var date=new Date();
      h1.innerHTML=date.toLocaleString();
    }
  </script>
</body>
</html>
