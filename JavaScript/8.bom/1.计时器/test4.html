<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./reset.css"/>
  <style>
    .banner{
      width: 520px;
      height: 300px;
      margin:1em auto;
      position: relative;
      overflow: hidden;
    }
    .banner .images{
      width: 1560px;
      height: 300px;
    }
    .banner .images a{
      float: left;
    }
    .banner .images a img{
      width: 520px;
      height: 300px;
    }
    .useButton{
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50px;
      height: 50px;
      color: #fff;
      font-size: 3em;
      text-align: center;
      margin: auto;
      line-height: 50px;
      cursor: pointer;
      border-radius: 50%;
      font-family: Arial;
    }
    .useButton:hover{
      background-color: #fff;
      color: red;
    }
    .left{
      left: 20px;
    }
    .right{
      right: 20px;
    }

    ul{
      position: absolute;
      width: 80px;
      height: 20px;
      bottom: 10px;
      left: 0;
      right: 0;
      margin: 0 auto;
      text-align: center;
      list-style: none;
      background-color:rgba(211,211,211,0.5);
      border-radius: 10px;
    }
    ul li{
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 50%;
      background-color: #fff;
      text-align: center;
      cursor: pointer;
      margin: 2px 4px;
    }
    .active{
      background-color: orangered;  
    }
    li:hover{
      background-color:aquamarine;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="images">
      <a href=""><img src="./img/1.jpg" alt=""></a>
      <a href=""><img src="./img/2.jpg" alt=""></a>
      <a href=""><img src="./img/3.jpg" alt=""></a>
    </div>
    <div class="useButton left" id="left">&lt;</div>
    <div class="useButton right" id="right">&gt;</div>
    <div class="nav">
      <ul>

      </ul>
    </div>
  </div>
  <script>
      var config={
        imgWidth:520,
        dotWidth:8,
        doms:{
          divImgs:document.querySelector('.images'),
          divDots:document.querySelector(".nav"),
          divLeft:document.querySelector("#left"),
          divRight:document.querySelector("#right"),
        },
        currentIndex:0,
        timer:{
          duration:16,
          total:2000,
          id:null
        }
      }
      config.doms.divLeft.addEventListener('click',function(){
        switchTo(config.currentIndex-1,"right");
      });
      config.doms.divRight.addEventListener('click',function(){
        switchTo(config.currentIndex+1,"left");
      });
      config.imgNumber=config.doms.divImgs.children.length;
      init();
      function initSize(){
        config.doms.divDots.style.width=config.dotWidth*config.imgNumber+"px";
        config.doms.divImgs.style.width=config.imgWidth*(config.imgNumber+2)+"px";
      }
      function initElement(){
        for(var i=0;i<config.imgNumber;i++){
          var li=document.createElement('li');
          config.doms.divDots.children[0].appendChild(li);
        }
        var children=config.doms.divImgs.children;
        var first=children[0],last=children[children.length-1];
        var newImg=first.cloneNode(true);
        config.doms.divImgs.appendChild(newImg);
        newImg=last.cloneNode(true);
        config.doms.divImgs.insertBefore(newImg,first);
      }
      function initPosition(){
        var left=(-config.currentIndex-1)*config.imgWidth;
        config.doms.divImgs.style.marginLeft=left+"px";
      }
      function setDotStatus(){
        for(var i=0;i<config.doms.divDots.children[0].children.length;i++){
          var dot=config.doms.divDots.children[0].children[i];
          if(i===config.currentIndex){
            dot.className="active";
          }else{
            dot.className=""
          }
        }
      }
      function init(){
        initSize();
        initElement();
        initPosition();
        setDotStatus();
      }
      function switchTo(index, direction) {
        if (index === config.currentIndex) {
          return;
        }
        if (!direction) {
          direction = "right";
        }
        
        // 修正1：保留原始目标index，不提前修正，让动画能滚动到克隆图位置
        var targetIndex = index;
        
        var newLeft = (-targetIndex - 1) * config.imgWidth;
        // 修正2：动画结束后再更新currentIndex，避免提前切换导致状态混乱
        // config.currentIndex = index; // 延后到动画结束
        setDotStatus();
        
        animateSwitch();  // ✅ 调用动画函数
        
        function animateSwitch() {
          stopAnimate();
          var number = Math.ceil(config.timer.total / config.timer.duration);
          var curNumber = 0;
          var distance;
          var marginLeft = parseInt(getComputedStyle(config.doms.divImgs).marginLeft); 
          var totalWidth = config.imgNumber * config.imgWidth;
          
          // 修正3：简化distance计算，直接用目标位置减去当前位置
          distance = newLeft - marginLeft;
          
          var everyDistance = distance / number;
          config.timer.id = setInterval(function () {
            marginLeft += everyDistance;
            curNumber++;
            config.doms.divImgs.style.marginLeft = marginLeft + "px";
            if (curNumber === number) {
              // 修正4：动画结束后再根据边界情况修正currentIndex
              if (targetIndex < 0) {
                config.currentIndex = config.imgNumber - 1;
              } else if (targetIndex >= config.imgNumber) {
                config.currentIndex = 0;
              } else {
                config.currentIndex = targetIndex;
              }
              // 修正5：无缝跳转后瞬间归位到真实图位置，用户感知不到
              var finalLeft = (-config.currentIndex - 1) * config.imgWidth;
              config.doms.divImgs.style.marginLeft = finalLeft + "px";
              setDotStatus();
              stopAnimate();
            }
          }, config.timer.duration);
        }
        
        function stopAnimate() {
          clearInterval(config.timer.id);  
          config.timer.id = null;
        }
      }
  </script>
</body>
</html>
