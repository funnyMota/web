<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林中的熊 · Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        canvas { display: block; width: 100%; height: 100%; }
        .hint {
            position: fixed;
            left: 16px;
            bottom: 16px;
            padding: 10px 14px;
            font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.45);
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="hint">拖拽旋转视角 · 滚轮缩放 · 熊在场景中央</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb8d4e8);
        scene.fog = new THREE.Fog(0xc5dde8, 25, 95);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 12, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 55;
        controls.maxPolarAngle = Math.PI / 2 - 0.08;
        controls.target.set(0, 2.2, 0);

        // 光照
        const hemi = new THREE.HemisphereLight(0xd4e8ff, 0x3d5c3a, 0.65);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xfff5e0, 1.05);
        sun.position.set(18, 32, 12);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -40;
        sun.shadow.camera.right = 40;
        sun.shadow.camera.top = 40;
        sun.shadow.camera.bottom = -40;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0xaaccff, 0.35);
        fill.position.set(-12, 8, -20);
        scene.add(fill);

        // 地面
        const groundGeo = new THREE.PlaneGeometry(220, 220, 64, 64);
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            pos.setY(i, Math.sin(x * 0.08) * 0.35 + Math.cos(z * 0.07) * 0.3);
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x3d6b3d,
            roughness: 0.92,
            metalness: 0,
            flatShading: true
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        function createTree() {
            const g = new THREE.Group();
            const trunkH = 1.4 + Math.random() * 2.2;
            const trunkR = 0.18 + Math.random() * 0.15;
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(trunkR * 0.85, trunkR, trunkH, 8),
                new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.95, flatShading: true })
            );
            trunk.position.y = trunkH / 2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            g.add(trunk);

            const layers = 2 + Math.floor(Math.random() * 2);
            let y = trunkH * 0.85;
            const greenBase = 0x1e5c2e + Math.floor(Math.random() * 0x303020);
            for (let i = 0; i < layers; i++) {
                const s = 1.15 - i * 0.22;
                const cone = new THREE.Mesh(
                    new THREE.ConeGeometry(1.1 * s, 1.8 + Math.random() * 0.6, 8),
                    new THREE.MeshStandardMaterial({
                        color: greenBase,
                        roughness: 0.88,
                        flatShading: true
                    })
                );
                cone.position.y = y + (1.8 + Math.random() * 0.6) / 2 * 0.5;
                cone.castShadow = true;
                cone.receiveShadow = true;
                g.add(cone);
                y += 1.1 + Math.random() * 0.4;
            }

            const scale = 0.75 + Math.random() * 0.85;
            g.scale.setScalar(scale);
            return g;
        }

        const CLEAR_R = 5.5;
        const forestR = 72;
        const treeCount = 160;
        for (let i = 0; i < treeCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = CLEAR_R + Math.random() * (forestR - CLEAR_R);
            const tree = createTree();
            tree.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            tree.rotation.y = Math.random() * Math.PI * 2;
            scene.add(tree);
        }

        // 内圈补一些树（仍避开中央熊区）
        for (let i = 0; i < 35; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = CLEAR_R + 0.5 + Math.random() * 8;
            const tree = createTree();
            tree.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            tree.rotation.y = Math.random() * Math.PI * 2;
            scene.add(tree);
        }

        // 熊（组合几何体，位于世界原点中心）
        function createBear() {
            const bear = new THREE.Group();
            const fur = new THREE.MeshStandardMaterial({
                color: 0x5c4033,
                roughness: 0.88,
                flatShading: true
            });
            const furDark = new THREE.MeshStandardMaterial({
                color: 0x3d2a22,
                roughness: 0.9,
                flatShading: true
            });
            const snoutMat = new THREE.MeshStandardMaterial({
                color: 0x6b5344,
                roughness: 0.9,
                flatShading: true
            });

            const body = new THREE.Mesh(new THREE.SphereGeometry(1.25, 12, 10), fur);
            body.scale.set(1.05, 0.95, 1.15);
            body.position.y = 1.45;
            body.castShadow = true;
            bear.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 10, 8), fur);
            head.position.set(0, 2.35, 0.35);
            head.castShadow = true;
            bear.add(head);

            const snout = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), snoutMat);
            snout.scale.set(1, 0.85, 1.2);
            snout.position.set(0, 2.15, 0.95);
            snout.castShadow = true;
            bear.add(snout);

            const nose = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 6, 4),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 })
            );
            nose.position.set(0, 2.18, 1.28);
            bear.add(nose);

            function ear(x) {
                const e = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), furDark);
                e.position.set(x, 2.75, 0.25);
                e.scale.set(1, 1, 0.65);
                e.castShadow = true;
                return e;
            }
            bear.add(ear(-0.55));
            bear.add(ear(0.55));

            const legGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.85, 8);
            const positions = [
                [-0.55, 0.42, 0.35],
                [0.55, 0.42, 0.35],
                [-0.55, 0.42, -0.45],
                [0.55, 0.42, -0.45]
            ];
            positions.forEach(([x, y, z]) => {
                const leg = new THREE.Mesh(legGeo, furDark);
                leg.position.set(x, y, z);
                leg.castShadow = true;
                bear.add(leg);
            });

            const armGeo = new THREE.CylinderGeometry(0.22, 0.26, 0.65, 8);
            const armL = new THREE.Mesh(armGeo, fur);
            armL.rotation.z = Math.PI / 2.3;
            armL.rotation.x = 0.15;
            armL.position.set(-1.15, 1.55, 0.2);
            armL.castShadow = true;
            bear.add(armL);
            const armR = new THREE.Mesh(armGeo, fur);
            armR.rotation.z = -Math.PI / 2.3;
            armR.rotation.x = 0.15;
            armR.position.set(1.15, 1.55, 0.2);
            armR.castShadow = true;
            bear.add(armR);

            bear.position.set(0, 0, 0);
            return bear;
        }

        const bear = createBear();
        scene.add(bear);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            bear.rotation.y = Math.sin(t * 0.35) * 0.08;
            bodyBreath(bear, t);
            controls.update();
            renderer.render(scene, camera);
        }

        function bodyBreath(group, t) {
            const bodyMesh = group.children[0];
            if (bodyMesh && bodyMesh.scale) {
                const b = 1 + Math.sin(t * 1.8) * 0.012;
                bodyMesh.scale.set(1.05 * b, 0.95 * b, 1.15 * b);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
