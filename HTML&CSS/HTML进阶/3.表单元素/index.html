<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <p>
    <input type="text" placeholder="请输入" value="100">

  </p>
  <p>
    <input type="date" name="" id="">
  </p>
  <p>
    <input type="search" name="" id="">
  </p>
  <p>
    <input type="range" name="" id=""  value="10" min="0" max="100">
  </p>
  <p>
    <input type="color" name="" id="">
  </p>
  <p>
    <input type="number" name="" id="">

  <p>
    <select>
      <option>北京</option>
      <option>上海</option>
      <option selected>成都</option>
    </select>
  </p>
  <p>

      <optgroup label="才艺">
        <option>常小雨</option>
      </optgroup>

    </select>

    <textarea name="" id="" style="width: 500px;height: 500px;"></textarea>
  </p>
  <p>
    <button type="button">提交</button>
  </p>
  <p>
    <input type="text" name="" list="userAgent">

      <option value="Firefox">火狐</option>
      <option value="Chrome">谷歌</option>
      <option value="IE">IE</option>
    </datalist>
  </p>
  <p>
    <fieldset>

      <p>
        <input type="text" name="" id="">
      </p>
      <p>
        <input type="password" name="" id="">
      </p>
    </fieldset>
  </p>
  <p>
    <form action="http://www.baidu.com" method="get">
      <p>
        <input type="text" name="userName">
      </p>
      <p>
        <input type="text" name="userPwd">
      </p>
      <p>
        <button>提交</button>
      </p>
    </form>
  </p>

</html>
